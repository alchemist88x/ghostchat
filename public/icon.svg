<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.3" />

  <!-- Ghost Message Symbol -->
  <g filter="url(#shadow)">
    <!-- Chat bubble outline -->
    <path d="M140 180 C140 130 180 90 256 90 C332 90 372 130 372 180 C372 260 332 290 286 290 L260 330 L234 290 C170 290 140 250 140 180 Z" fill="url(#glow)" />
    
    <!-- Eyes -->
    <circle cx="216" cy="180" r="14" fill="#0f172a" />
    <circle cx="296" cy="180" r="14" fill="#0f172a" />
    <circle cx="220" cy="176" r="4" fill="#ffffff" />
    <circle cx="300" cy="176" r="4" fill="#ffffff" />

    <!-- Disappearing sparkle / dots -->
    <circle cx="256" cy="380" r="10" fill="#06b6d4" opacity="0.9" />
    <circle cx="210" cy="410" r="7" fill="#6366f1" opacity="0.6" />
    <circle cx="302" cy="410" r="7" fill="#6366f1" opacity="0.6" />
    <circle cx="256" cy="440" r="4" fill="#38bdf8" opacity="0.3" />
  </g>
</svg>
